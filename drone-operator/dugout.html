<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dugout Launch</title>
<style>
  html, body { margin: 0; height: 100%; background: #08080a; overflow: hidden; }
  canvas {
    display: block; position: fixed; left: 0; top: 0;
    width: 100vw; height: 100vh;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

/* =====================================================================
   DUGOUT LAUNCH — side-view cutaway, 128x96 logical, camera follows
   the operator out of the dugout, to the launch spot, and back inside.
   ===================================================================== */

var W = 128, H = 96, M = 1;
var WW = 256, WH = 150;               // world size
var SURF = 64;                        // surface row (top of ground)
var FLOOR = 124;                      // dugout floor row

/* ---------------- Palette ---------------- */
var PAL = [
  '#060915','#0b1226','#121b36','#1b2647','#34416a','#e2e6d2','#a1aa96','#050b0f',
  '#0e1719','#121510','#1c1e16','#2e2c1f','#1b2d17','#2f4622','#252b19','#3c4527',
  '#586039','#7a7150','#4b4731','#2c2116','#08080a','#1e2125','#373b41','#60666e',
  '#8095bb','#8c6a50','#2b5d3b','#7be596','#ea3328','#561916','#3fe266','#194523',
  '#f2f3ec','#2d52b8','#6b6352',
  '#150e08', // 35 SOIL0  deep earth / back wall
  '#271a10', // 36 SOIL1  earth cut face
  '#3b2a1a', // 37 SOIL2  earth light
  '#43301e', // 38 WOOD0  planks / logs
  '#6b4a2b', // 39 WOOD1  lit wood
  '#a8763c', // 40 WARM   lamp-lit highlight
  '#f6d27e'  // 41 LAMP   bulb
];
var SKY0=0,SKY1=1,SKY2=2,SKY3=3,CLDL=4,MOON=5,MOONS=6,TREE=7,HILL=8,GND0=9,GND1=10,GND2=11,
    GRS0=12,GRS1=13,OL0=14,OL1=15,OL2=16,KHA=17,KHD=18,BRN0=19,BLK=20,GR0=21,GR1=22,GR2=23,
    RIM=24,SKIN=25,GLW0=26,GLW1=27,RED=28,REDD=29,GRN=30,GRND=31,WHT=32,BLU=33,DST0=34,
    SOIL0=35,SOIL1=36,SOIL2=37,WOOD0=38,WOOD1=39,WARM=40,LAMP=41;

/* ---------------- Canvases ---------------- */
function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
var disp = document.getElementById('c');
var dctx = disp.getContext('2d', { alpha: false });
var off = mk(W + 2 * M, H + 2 * M), octx = off.getContext('2d');
var SKW = 144, SKH = 124;
var skyC = mk(SKW, SKH), treeC = mk(184, WH), worldC = mk(WW, WH);
var g = null;

var FORCE = -1, RIMC = RIM;
function rect(x, y, w, h, c) { g.fillStyle = PAL[FORCE >= 0 ? FORCE : c]; g.fillRect(x, y, w, h); }
function px(x, y, c) { g.fillStyle = PAL[FORCE >= 0 ? FORCE : c]; g.fillRect(x, y, 1, 1); }
function lineP(x0, y0, x1, y1, c) {
  var dx = x1 - x0, dy = y1 - y0, n = Math.max(dx < 0 ? -dx : dx, dy < 0 ? -dy : dy);
  if (n === 0) { px(x0, y0, c); return; }
  for (var i = 0; i <= n; i++) px(x0 + Math.round(dx * i / n), y0 + Math.round(dy * i / n), c);
}

var seed = 0x2f6b9e31 | 0;
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }
function hash(x, y) {
  var h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function ease(u) { return u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function vnoise(x, y, sx, sy, s) {
  var fx = x / sx, fy = y / sy, ix = Math.floor(fx), iy = Math.floor(fy);
  var ux = ease(fx - ix), uy = ease(fy - iy);
  var a = hash(ix, iy + s), b = hash(ix + 1, iy + s), c = hash(ix, iy + s + 1), d = hash(ix + 1, iy + s + 1);
  return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy;
}
var BAYER4 = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
function bay(x, y) { return BAYER4[((y & 3) << 2) | (x & 3)]; }

/* =====================================================================
   SPRITE PARTS
   ===================================================================== */
var CH = { K:BLK, '0':OL0, '1':OL1, '2':OL2, v:KHD, V:KHA, d:BRN0, g:GR0, G:GR1, H:GR2,
           m:RIM, s:SKIN, w:WHT, u:BLU, r:RED };
var HEAD = [
  "...mm22...",
  "..m2112122",
  ".m21112111",
  ".m112111GG",
  "m11111111G",
  "m001111110",
  ".K0000000K",
  ".GGgggssss",
  ".GHggggggg",
  "..Gggggggg",
  "...ggggg.."
];
var TORSO = [
  "...mm111112...",
  "..m1d1111111d.",
  "..m1dvvvvvvvd.",
  ".m11vVVVVVVVv.",
  ".m01vdvdvdvdv.",
  ".001vvvvvvvvv.",
  ".001vVVdVVdVV.",
  ".000vvvdvvdvv.",
  ".000vvvdvvdvv.",
  "..00vvvvvvvvv.",
  "..0KKKKVKKKKK.",
  "..011101110110"
];
var LEG = [
  "1111.", "1111.", "1111.", "1111.", "GHG1.", "1111.", "1111.", "0111.", "dvdd.", "ddddd", "KKKKK"
];
var KNEEL = [               // one knee down, front foot planted (hips at row 0)
  "..111111111111..",
  "..1111111111111.",
  "..0111.....1111.",
  "..GHG0.....dvdd.",
  "Kdd000.....KKKKK"
];
var SIT = [                 // seated on a crate (hips at row 0)
  "..11111111111...",
  "..00111111111...",
  "..........1111..",
  "..........1111..",
  "..........dvdd..",
  "..........ddddd.",
  "..........KKKKK."
];
var PACK = [
  ".0000.", "m11110", "m12110", "011110", "0vvvv0", "0vVVv0", "0vvvv0", "011110", ".0000."
];
var ARM = [ "221", "ww1", "uu1", "rr1", "110", "101", "110" ];

var RUNS = [];
function buildPart(rows, camo, cox, coy) {
  var start = RUNS.length / 4;
  for (var y = 0; y < rows.length; y++) {
    var row = rows[y], prev = -1, rs = 0;
    for (var x = 0; x <= row.length; x++) {
      var c = -1;
      if (x < row.length && row[x] !== '.') {
        c = CH[row[x]];
        if (camo && c === OL1) {
          var n = hash((x + cox) >> 1, (y + coy) >> 1);
          if (n < 0.3) c = OL0; else if (n > 0.86) c = OL2;
        }
      }
      if (c !== prev) { if (prev >= 0) RUNS.push(rs, y, x - rs, prev); prev = c; rs = x; }
    }
  }
  return { o: start, n: RUNS.length / 4 - start };
}
var P_HEAD = buildPart(HEAD, true, 8, 0), P_TORSO = buildPart(TORSO, true, 5, 10);
var P_LEG = buildPart(LEG, true, 12, 21), P_LEGB = buildPart(LEG, true, 3, 21);
var P_KNEEL = buildPart(KNEEL, true, 5, 27), P_SIT = buildPart(SIT, true, 5, 27);
var P_PACK = buildPart(PACK, true, 1, 11), P_ARM = buildPart(ARM, true, 15, 11);
var RUNA = new Int16Array(RUNS); RUNS = null;
var DARK = new Uint8Array(PAL.length);
for (var q = 0; q < PAL.length; q++) DARK[q] = q;
DARK[OL0]=GND0; DARK[OL1]=OL0; DARK[OL2]=OL1; DARK[GR1]=GR0; DARK[GR2]=GR1; DARK[BRN0]=BLK; DARK[KHD]=OL0; DARK[RIM]=OL1;

/* ---- character-local drawing (24px box, mirrored when facing left) ---- */
var CXo = 0, CYo = 0, FL = false;
function lr(lx, ly, w, h, c) {
  if (FL) rect(CXo + 24 - lx - w, CYo + ly, w, h, c); else rect(CXo + lx, CYo + ly, w, h, c);
}
function lp(lx, ly, c) { lr(lx, ly, 1, 1, c); }
function lline(x0, y0, x1, y1, c) {
  var dx = x1 - x0, dy = y1 - y0, n = Math.max(dx < 0 ? -dx : dx, dy < 0 ? -dy : dy);
  for (var i = 0; i <= n; i++) lp(x0 + Math.round(dx * i / n), y0 + Math.round(dy * i / n), c);
}
function lpart(p, lx, ly, dark, maxRow) {
  for (var i = p.o, e = p.o + p.n; i < e; i++) {
    var k = i << 2;
    if (RUNA[k + 1] >= maxRow) continue;
    var c = RUNA[k + 3]; if (dark) c = DARK[c]; if (c === RIM) c = RIMC;
    lr(lx + RUNA[k], ly + RUNA[k + 1], RUNA[k + 2], 1, c);
  }
}

/* =====================================================================
   PRE-RENDERED LAYERS
   ===================================================================== */
var MOX = 26, MOY = 15, MOR = 7;
function genSky() {
  g = skyC.getContext('2d');
  var x, y;
  for (y = 0; y < SKH; y++) for (x = 0; x < SKW; x++) {
    var yy = y + (bay(x, y) - 7.5) * 0.42;
    px(x, y, yy < 17 ? SKY0 : yy < 33 ? SKY1 : yy < 47 ? SKY2 : SKY3);
  }
  for (y = -MOR - 1; y <= MOR + 1; y++) for (x = -MOR - 1; x <= MOR + 1; x++) {
    if (x * x + y * y > MOR * MOR + MOR * 0.6) continue;
    var c = MOON;
    if ((x - 9) * (x - 9) + y * y < 8.2 * 8.2) c = SKY3;
    else if ((x - 8) * (x - 8) + y * y < 9.4 * 9.4) c = MOONS;
    px(MOX + x, MOY + y, c);
  }
  px(MOX-3,MOY-3,MOONS); px(MOX-2,MOY-3,MOONS); px(MOX-4,MOY+1,MOONS); px(MOX-1,MOY+2,MOONS);
  px(MOX-2,MOY+2,MOONS); px(MOX-5,MOY-1,MOONS); px(MOX,MOY-5,MOONS); px(MOX-5,MOY-5,WHT); px(MOX-6,MOY-3,WHT);
  var CL = [[8,19,30],[14,21,20],[2,23,14],[62,11,28],[82,13,16],[36,35,24],[96,29,22],[112,41,18]];
  for (var ci = 0; ci < CL.length; ci++) {
    var cx = CL[ci][0], cy = CL[ci][1], cl = CL[ci][2];
    rect(cx + 2, cy, cl - 4, 1, SKY3); rect(cx + 6, cy - 1, cl - 13, 1, SKY3);
    px(cx, cy, SKY2); px(cx + 1, cy, SKY3); px(cx + cl - 2, cy, SKY3);
    if (cx < 50) for (x = cx + 6; x < cx + cl - 7; x++) if (hash(x, cy) < 0.55) px(x, cy - 1, CLDL);
  }
}
function farY(x) { return 57 + Math.round(2.5 * Math.sin(x * 0.045 + 0.5) + 1.5 * Math.sin(x * 0.11 + 2.0)); }
function genTrees() {
  g = treeC.getContext('2d');
  var x, y;
  for (x = 0; x < 184; x++) { var fy = farY(x); rect(x, fy, 1, 72 - fy, HILL); }
  seed = 0x51ed27 | 0; x = 0;
  while (x < 186) {
    var base = farY(x) + 1;
    if (rnd() < 0.72) {
      var th = 4 + ((rnd() * 7) | 0);
      for (var r = 0; r < th; r++) {
        var half = (r * 0.42) | 0; if (r % 3 === 2 && half > 0) half -= 1;
        rect(x - half, base - th + r, half * 2 + 1, 1, TREE);
      }
    } else {
      var br = 2 + ((rnd() * 3) | 0);
      for (y = -br; y <= br; y++) for (var bx = -br - 1; bx <= br + 1; bx++)
        if (bx * bx * 0.7 + y * y <= br * br + 0.5 && hash(x + bx, y + 40) > 0.08) px(x + bx, base - br + y, TREE);
    }
    x += 2 + ((rnd() * 4) | 0);
  }
}

// --- world geometry helpers ---
var ROOM_X0 = 16, ROOM_X1 = 85, ROOM_Y0 = 88;
var STAIR_X0 = 92, STAIR_N = 15;                 // step i: x 92+4i..95+4i, tread y 120-4i
var LAMPX = 58, LAMPY = 93;
var GXD = 198, GYD = 61;                          // drone launch spot (body centre)
function treadY(x) { var i = (x - STAIR_X0) >> 2; return 120 - 4 * i; }
function feetY(x) {
  if (x < STAIR_X0) return FLOOR - 1;
  if (x >= STAIR_X0 + 4 * STAIR_N) return SURF - 1;
  return treadY(x) - 1;
}
function inRoom(x, y) { return x >= ROOM_X0 && x <= ROOM_X1 + 6 && y >= ROOM_Y0 && y < FLOOR; }
function inShaft(x, y) { return x >= STAIR_X0 && x < STAIR_X0 + 4 * STAIR_N && y >= SURF && y < treadY(x); }

function genWorld() {
  g = worldC.getContext('2d');
  var x, y, i, c;
  // earth cross-section
  for (x = 0; x < WW; x++) for (y = SURF; y < WH; y++) {
    var d = y - SURF;
    var n = vnoise(x, y, 9, 5, 300) + (bay(x, y) - 7.5) * 0.014;
    c = SOIL1;
    if (n > 0.66) c = SOIL2; else if (n < 0.3) c = SOIL0;
    if (y > 128 && (bay(x, y) < (y - 128) * 0.7)) c = SOIL0;
    if (d < 3) c = d === 0 ? GRS0 : (hash(x, y) < 0.5 ? GND1 : SOIL1);
    var h = hash(x, y + 77);
    if (d > 3 && d < 14 && h < 0.02) c = BRN0;              // roots
    px(x, y, c);
  }
  // stones
  seed = 0x5a5a11 | 0;
  for (i = 0; i < 40; i++) {
    x = (rnd() * WW) | 0; y = SURF + 6 + ((rnd() * 80) | 0);
    if (inRoom(x, y) || inShaft(x, y) || inShaft(x, y - 2)) continue;
    var sw = 2 + ((rnd() * 3) | 0);
    rect(x, y, sw, 2, GR0); rect(x + 1, y, sw - 1, 1, GR1);
  }
  // roof logs (cross-sections) over the dugout
  for (i = 0; i < 14; i++) {
    var lx = 15 + i * 6, ly = 84;
    for (y = -3; y <= 3; y++) for (x = -3; x <= 3; x++) {
      var dd = x * x + y * y; if (dd > 10) continue;
      px(lx + x, ly + y, dd > 6 ? WOOD0 : dd > 2 ? WOOD1 : SOIL2);
    }
    px(lx - 1, ly - 2, WOOD1);
  }
  for (i = 0; i < 13; i++) {
    var lx2 = 18 + i * 6, ly2 = 78;
    for (y = -2; y <= 2; y++) for (x = -2; x <= 2; x++) {
      var d2 = x * x + y * y; if (d2 > 5) continue;
      px(lx2 + x, ly2 + y, d2 > 2 ? WOOD0 : SOIL2);
    }
  }
  // dugout room: plank revetment back wall, lamp-lit
  for (x = ROOM_X0; x <= ROOM_X1 + 6; x++) for (y = ROOM_Y0; y < FLOOR; y++) {
    var ldx = x - LAMPX, ldy = (y - LAMPY) * 1.3, ld = Math.sqrt(ldx * ldx + ldy * ldy) + (bay(x, y) - 7.5) * 0.5;
    var gap = ((y - ROOM_Y0) % 5) === 4;
    var lit = ld < 13 ? 2 : ld < 24 ? 1 : 0;
    if (gap) c = lit === 2 ? WOOD0 : SOIL0;
    else {
      c = lit === 2 ? WOOD1 : lit === 1 ? WOOD0 : SOIL1;
      if (hash(x >> 3, y / 5 | 0) < 0.25 && lit < 2) c = SOIL0 === c ? SOIL1 : (lit ? SOIL1 : SOIL0);
      if (lit === 2 && hash(x, y) < 0.05) c = WARM;
    }
    if (x === ROOM_X0 || y === ROOM_Y0) c = SOIL0;
    px(x, y, c);
  }
  // posts
  var POSTS = [ROOM_X0 + 1, 50, 86];
  for (i = 0; i < POSTS.length; i++) {
    var pxx = POSTS[i];
    rect(pxx, ROOM_Y0, 3, FLOOR - ROOM_Y0, WOOD0);
    var lit2 = Math.abs(pxx + 1 - LAMPX) < 14;
    rect(pxx, ROOM_Y0, 1, FLOOR - ROOM_Y0, lit2 ? WARM : WOOD1);
    px(pxx + 2, ROOM_Y0 + 6, SOIL0); px(pxx + 2, ROOM_Y0 + 19, SOIL0);
  }
  // floor planks
  for (x = ROOM_X0; x < STAIR_X0; x++) {
    px(x, FLOOR, (x % 9 === 0) ? SOIL0 : (Math.abs(x - LAMPX) < 16 ? WOOD1 : WOOD0));
    px(x, FLOOR + 1, WOOD0);
  }
  // stair shaft (open trench) with board revetment
  for (x = STAIR_X0 - 4; x < STAIR_X0 + 4 * STAIR_N; x++) {
    var top = x < STAIR_X0 ? ROOM_Y0 : SURF;
    var bot = x < STAIR_X0 ? FLOOR : treadY(x);
    for (y = top; y < bot; y++) {
      c = SOIL0;
      if (x >= STAIR_X0 && (x % 6) !== 0 && y > SURF + 1) c = (hash(x / 6 | 0, y >> 2) < 0.5) ? SOIL1 : SOIL0;
      if ((x % 6) === 5 && x >= STAIR_X0) c = WOOD0;
      px(x, y, c);
    }
  }
  for (i = 0; i < STAIR_N; i++) {
    rect(STAIR_X0 + 4 * i, 120 - 4 * i, 4, 1, WOOD1);
    rect(STAIR_X0 + 4 * i, 121 - 4 * i, 4, 1, WOOD0);
    px(STAIR_X0 + 4 * i, 121 - 4 * i, SOIL0);
  }
  // door frame
  rect(86, ROOM_Y0 - 1, 7, 2, WOOD0); rect(86, ROOM_Y0 - 1, 7, 1, WOOD1);
  rect(91, ROOM_Y0, 2, FLOOR - ROOM_Y0, WOOD0); px(91, ROOM_Y0 + 4, WOOD1); px(91, ROOM_Y0 + 14, WOOD1);
  // mound + sandbags over the roof
  for (x = 8; x <= 92; x++) {
    var mh = Math.round(5 * Math.sin((x - 8) / 84 * Math.PI));
    for (y = SURF - mh; y < SURF; y++) px(x, y, y === SURF - mh ? GRS0 : SOIL1);
  }
  for (var row = 0; row < 2; row++) for (x = 22 + row * 4; x < 80 - row * 4; x += 8) {
    var by = SURF - 7 - row * 3;
    rect(x, by, 7, 3, KHD); rect(x + 1, by, 5, 1, KHA); px(x, by + 2, BRN0); px(x + 6, by + 2, BRN0);
    if (x < 50) px(x + 1, by, RIM);
  }
  for (x = 156; x < 170; x += 7) { rect(x, SURF - 3, 6, 3, KHD); rect(x + 1, SURF - 3, 4, 1, KHA); }
  rect(158, SURF - 6, 6, 3, KHD); rect(159, SURF - 6, 4, 1, KHA);
  // camo net on poles over the entrance
  rect(126, SURF - 18, 1, 18, WOOD0); rect(140, SURF - 16, 1, 16, WOOD0);
  for (x = 86; x <= 150; x++) {
    var ny = x < 126 ? Math.round(SURF - 7 - (x - 86) * 0.27) : x < 140 ? SURF - 18 + ((x - 126) / 7 | 0) : Math.round(SURF - 16 + (x - 140) * 1.4);
    for (y = ny; y < ny + 3; y++) {
      if (y >= SURF) continue;
      var hh = hash(x, y + 9);
      if (((x + y) & 1) === 0 || hh < 0.3) px(x, y, hh < 0.15 ? KHD : hh < 0.55 ? OL0 : GRS0);
    }
    if (hash(x, 3) < 0.3) px(x, ny + 3, OL0);
  }
  // launch pad (plywood) + surface grass
  rect(GXD - 7, SURF, 15, 1, WOOD1); rect(GXD - 7, SURF + 1, 15, 1, WOOD0);
  seed = 0x77aa13 | 0;
  for (i = 0; i < 70; i++) {
    x = (rnd() * WW) | 0;
    if (x > 86 && x < 156) continue;
    if (Math.abs(x - GXD) < 10) continue;
    var hb = 1 + ((rnd() * 3) | 0);
    var gy = x > 8 && x < 92 ? SURF - Math.round(5 * Math.sin((x - 8) / 84 * Math.PI)) : SURF;
    rect(x, gy - hb, 1, hb, GRS0); if (rnd() < 0.5) px(x, gy - hb, GRS1);
  }
  // furniture: table, laptop, radio, crate seat, drone case, jerrycan
  rect(18, 108, 23, 2, WOOD1); rect(18, 109, 23, 1, WOOD0); rect(19, 110, 2, 14, WOOD0); rect(38, 110, 2, 14, WOOD0);
  rect(19, 117, 21, 1, WOOD0);
  rect(21, 106, 10, 2, GR1); px(21, 106, GR2);                   // laptop base
  rect(22, 98, 8, 8, GR0); rect(22, 98, 8, 1, GR1);             // laptop lid frame
  rect(33, 102, 6, 6, OL0); rect(33, 102, 6, 1, OL1); px(34, 104, GR2); px(36, 104, GR2); rect(37, 95, 1, 7, GR1);
  rect(48, 119, 10, 5, KHD); rect(48, 119, 10, 1, KHA); px(52, 121, BRN0); px(53, 121, BRN0);   // crate seat
  rect(64, 117, 13, 7, GR0); rect(64, 117, 13, 1, GR1); rect(68, 119, 4, 1, GR2);              // hard case
  rect(79, 115, 5, 9, OL0); rect(79, 115, 5, 1, OL1); rect(80, 113, 2, 2, GR0);                 // jerrycan
  // hanging lamp
  rect(LAMPX, ROOM_Y0, 1, 4, GR0); rect(LAMPX - 1, ROOM_Y0 + 3, 3, 1, GR1);
}

/* ---------------- Stars ---------------- */
var NS = 36;
var sX = new Int16Array(NS), sY = new Int16Array(NS), sB = new Uint8Array(NS), sPh = new Float32Array(NS), sSp = new Float32Array(NS);
function genStars() {
  var data = skyC.getContext('2d').getImageData(0, 0, SKW, SKH).data;
  function isSky(x, y) {
    var i = (y * SKW + x) * 4;
    return data[i] === 6 || data[i] === 11 || data[i] === 18;   // SKY0..SKY2 red channels
  }

  if (dState === 2 || dState === 3) { drawFoldedW(GXD, GYD + 1, dState === 3); return; }
  if (!dVis) return;
  var x = Math.round(dX) + vibX, y = Math.round(dY) + vibY, t = dTilt;
  if (dLevel === 0) {
    if (dAlt < 26) {
      var sw = 13 - ((dAlt / 2.5) | 0);
      if (sw > 2) rect(x - (sw >> 1) + ((dAlt / 6) | 0), SURF, sw, 1, GND0);
    }
    var bx0 = x - 4, by0 = y - 2 - t, fx0 = x + 4, fy0 = y - 2 + t;
    var bx1 = x - 5, by1 = y + 2 - t, fx1 = x + 5, fy1 = y + 2 + t;
    lineP(x - 3, y - 1, bx0, by0, GR1); lineP(x + 3, y - 1, fx0, fy0, GR1);
    px(bx0, by0, GR1); px(fx0, fy0, GR1);
    prop(bx0, by0 - 1, 2, 0); prop(fx0, fy0 - 1, 2, 1);
    rect(x - 3, y - 1, 7, 3, GR0); rect(x - 3, y, 7, 1, GR1);
    rect(x - 2, y - 1, 5, 1, GR2); px(x - 2, y - 1, RIM); px(x - 1, y - 1, RIM);
    px(x - 4, y, GR0); px(x - 4, y + 1, GR0); px(x + 4, y, GR0);
    px(x + 3, y + 2, GR1); px(x + 4, y + 1, BLK); px(x + 5, y + 1, GR2);
    lineP(x - 3, y + 1, bx1, by1, GR2); lineP(x + 3, y + 1, fx1, fy1, GR2);
    px(bx1, by1, GR2); px(fx1, fy1, GR2);
    prop(bx1, by1 - 1, 2, 2); prop(fx1, fy1 - 1, 2, 3);
    lrX = fx0 + 1; lrY = fy0; lgX = fx1 + 1; lgY = fy1;
    navPx(lrX, lrY, RED, REDD, lights && navOn);
    navPx(lgX, lgY, GRN, GRND, lights && navOn);
    if (strobe) px(x - 4, y - 1, WHT);
    if (lights) px(bx1 - 1, by1, ((frame >> 5) & 1) ? WHT : GR2);
    if (lights && navOn && dAlt < 7) { px(lgX, SURF, GRND); px(lgX + 1, SURF, GRND); }
  } else if (dLevel === 1) {
    rect(x - 2, y, 5, 1, GR1); px(x - 1, y, GR2); px(x + 3, y, BLK);
    prop(x - 2, y - 1 - t, 1, 0); prop(x + 2, y - 1 + t, 1, 1); prop(x - 3, y + 1 - t, 1, 2); prop(x + 3, y + 1 + t, 1, 3);
    navPx(x + 4, y - 1 + t, RED, -1, navOn); navPx(x + 5, y + 1 + t, GRN, -1, navOn);
    if (strobe) px(x - 3, y, WHT);
  } else if (dLevel === 2) {
    rect(x - 1, y, 3, 1, GR1);
    px(x - 2, y - 1, (frame & 1) ? GR1 : GR0); px(x + 2, y - 1, (frame & 1) ? GR0 : GR1);
    if (navOn) { px(x + 2, y, RED); px(x + 2, y + 1, GRN); }
    if (strobe) px(x - 2, y, WHT);
  } else {
    if (navOn) { px(x, y, RED); px(x + 1, y, GRN); }
    if (strobe) px(x - 1, y, WHT);
  }
}

function drawInterior() {
  // lamp flicker
  var fl = hash((T * 12) | 0, 5) < 0.04;
  px(LAMPX, ROOM_Y0 + 4, fl ? WARM : LAMP); px(LAMPX - 1, ROOM_Y0 + 4, WARM); px(LAMPX + 1, ROOM_Y0 + 4, WARM);
  // laptop screen: standby or FPV feed
  var x0 = 23, y0 = 99;
  if (pGlow >= 1 || seg >= 16) {
    rect(x0, y0, 6, 6, BLK);
    var hz = y0 + 3 + (dState === 5 ? clamp(Math.round(dAlt / 12), 0, 2) : 0) - (dTilt > 0 ? 1 : 0);
    rect(x0, hz, 6, 1, GLW1);
    rect(x0, hz + 1, 6, y0 + 6 - hz - 1, GLW0);
    px(x0 + 2 + ((T * 3) | 0) % 2, y0 + 1, GLW0);            // OSD blink
    px(x0 + 5, y0, (frame >> 4) & 1 ? GLW1 : GLW0);
  } else {
    rect(x0, y0, 6, 6, GR0); px(x0 + 1, y0 + 1, GLW0);
  }
  // radio LED
  px(35, 106, ((frame >> 5) & 1) ? GRN : GRND);
}

function drawTufts() {
  var wash = dState === 5 && dVis && propSpd > 0.4 && dAlt < 22;
  for (var i = 0; i < NT; i++) {
    var x = tX[i], y = SURF - 1;
    var b = Math.sin(T * 1.1 + i * 1.7) * 0.8;
    if (wash) {
      var d = x - dX, ad = d < 0 ? -d : d;
      if (ad < 24) {
        var sg = d < 0 ? -1 : 1;
        b += sg * (ad < 12 ? 2 : 1) * (dAlt < 12 ? 1 : 0.6);
        if ((((frame >> 2) + i) & 1) === 1) b -= sg * 0.7;
      }
    }
    b = Math.round(b); if (b > 2) b = 2; if (b < -2) b = -2;
    for (var k = -1; k <= 1; k++) {
      var bh = 4 - (k !== 0 ? 1 : 0);
      for (var j = 0; j < bh; j++) px(x + k + Math.round(b * j / bh), y - j, j >= bh - 1 ? GRS1 : GRS0);
    }
  }
}

function drawParticles(front) {
  for (var i = 0; i < NP; i++) {
    if (!pA[i]) continue;
    var t = pT[i], r = pL[i] / pML[i], c;
    if (front !== (t === 3 || t === 4)) continue;
    if (t === 0) c = r > 0.6 ? DST0 : r > 0.3 ? GND2 : GR0;
    else if (t === 2) c = (r > 0.25 && r < 0.75) ? CLDL : SKY3;
    else if (t === 3) c = r > 0.5 ? RED : REDD;
    else if (t === 4) c = r > 0.5 ? GRN : GRND;
    else c = SOIL2;
    px(Math.round(pX[i]), Math.round(pY[i]), c);
  }
}

function render() {
  g = octx;
  g.setTransform(1, 0, 0, 1, M, M);
  var skx = -Math.round(camX * 0.08), sky = -Math.round(camY * 0.3);
  g.drawImage(skyC, skx - M, sky - M);
  for (var i = 0; i < NS; i++) {
    var v = Math.sin(T * sSp[i] + sPh[i]), x = sX[i] + skx, y = sY[i] + sky;
    if (sB[i]) { if (v > -0.3) px(x, y, MOON); else if (v > -0.85) px(x, y, CLDL); }
    else { if (v > 0.1) px(x, y, CLDL); else if (v > -0.6) px(x, y, SKY3); }
  }
  g.drawImage(treeC, -Math.round(camX * 0.4) - M, -camY);
  g.drawImage(worldC, -camX, -camY);
  g.setTransform(1, 0, 0, 1, M - camX, M - camY);
  drawInterior();
  drawParticles(false);
  drawTufts();
  if (dState === 0 || dState === 2 || dState === 3) drawDrone();
  drawChar();
  if (dState >= 4) drawDrone();
  drawParticles(true);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (fade > 0) g.drawImage(FADE[fade], M, M + shake);
  dctx.drawImage(off, M, M + shake, W, H, ox, oy, W * scale, H * scale);
}

/* ---------------- Display ---------------- */
var scale = 1, ox = 0, oy = 0;
function resize() {
  var dpr = window.devicePixelRatio || 1;
  var cw = Math.max(1, Math.floor(window.innerWidth * dpr)), ch = Math.max(1, Math.floor(window.innerHeight * dpr));
  disp.width = cw; disp.height = ch;
  scale = Math.max(1, Math.floor(Math.min(cw / W, ch / H)));
  ox = Math.floor((cw - W * scale) / 2); oy = Math.floor((ch - H * scale) / 2);
  dctx.imageSmoothingEnabled = false;
  dctx.fillStyle = PAL[BLK]; dctx.fillRect(0, 0, cw, ch);
}
window.addEventListener('resize', resize);
resize();

var last = -1, acc = 0, STEP_MS = 1000 / 60;
function loop(ts) {
  if (last < 0) last = ts;
  var dt = ts - last; last = ts; if (dt > 250) dt = 250;
  acc += dt;
  while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
  render();
  requestAnimationFrame(loop);
}
resetLoop(); update(); render();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
